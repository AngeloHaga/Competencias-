<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de usuario · Ecosistema Educativo</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/modulos/registro.css"></head>
<body><div id="plantilla"></div><main id="contenido" class="contenedor">
  <div class="tarjeta auth-tarjeta">
    <header class="auth-tarjeta__cabecera">
      <h1 class="auth-tarjeta__titulo">Crear una cuenta</h1>
      <p class="auth-tarjeta__subtitulo">Regístrate para acceder a los cursos, actividades interactivas y tutorías inteligentes.</p>
    </header>

    <form id="formRegistro" novalidate class="pila">
      <div class="fila-campos">
        <div class="campo" id="grupoNombre">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="given-name" required placeholder="Juan">
          <span class="campo__error" id="errorNombre" aria-live="polite"></span>
        </div>

        <div class="campo" id="grupoApellido">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" autocomplete="family-name" required placeholder="Pérez">
          <span class="campo__error" id="errorApellido" aria-live="polite"></span>
        </div>
      </div>

      <div class="campo" id="grupoCorreo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required placeholder="juan.perez@correo.com">
        <span class="campo__error" id="errorCorreo" aria-live="polite"></span>
      </div>

      <div class="campo" id="grupoClave">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="new-password" required placeholder="Mínimo 8 caracteres (letras y números)">
        <span class="campo__error" id="errorClave" aria-live="polite"></span>
      </div>

      <div class="campo" id="grupoClaveConfirmar">
        <label for="claveConfirmar">Confirmar contraseña</label>
        <input type="password" id="claveConfirmar" name="claveConfirmar" autocomplete="new-password" required placeholder="Repite tu contraseña">
        <span class="campo__error" id="errorClaveConfirmar" aria-live="polite"></span>
      </div>

      <div class="campo campo--checkbox" id="grupoConsentimiento">
        <label class="etiqueta-checkbox" for="consentimiento">
          <input type="checkbox" id="consentimiento" name="consentimiento" required>
          <span>Acepto el <a href="/paginas/privacidad.html" target="_blank" rel="noopener">aviso de privacidad</a></span>
        </label>
        <span class="campo__error" id="errorConsentimiento" aria-live="polite"></span>
      </div>

      <div class="auth-tarjeta__acciones">
        <button type="submit" class="btn btn--primario btn--completo" id="btnRegistro">
          Crear cuenta
        </button>
      </div>
    </form>

    <footer class="auth-tarjeta__pie">
      <p>¿Ya tienes una cuenta? <a href="/paginas/ingreso.html">Inicia sesión</a></p>
    </footer>
  </div>
</main>
<script type="module" src="/js/modulos/registro.js"></script></body></html>
