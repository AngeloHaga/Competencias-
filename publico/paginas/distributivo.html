<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributivo Académico · Ecosistema Educativo</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/modulos/distributivo.css"></head>
<body><div id="plantilla"></div><main id="contenido" class="contenedor">
  <div class="distributivo-layout pila">
    <header class="distributivo-cabecera">
      <div>
        <h1 class="distributivo-cabecera__titulo">Distributivo Académico</h1>
        <p class="distributivo-cabecera__subtitulo">Asignación de asignaturas, paralelos, docentes y estudiantes por período.</p>
      </div>
      <div>
        <button type="button" class="btn btn--primario" id="btnNuevoGrupo">
          + Nuevo grupo
        </button>
      </div>
    </header>

    <div class="tarjeta distributivo-tabla-tarjeta">
      <div class="tabla-contenedor">
        <table class="tabla" id="tablaDistributivo">
          <thead>
            <tr>
              <th scope="col">Asignatura</th>
              <th scope="col">Paralelo</th>
              <th scope="col">Período</th>
              <th scope="col">Docente asignado</th>
              <th scope="col">Estudiantes</th>
              <th scope="col" class="texto-derecha">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTablaDistributivo">
            <tr>
              <td colspan="6" class="texto-centro">Cargando distributivo...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script type="module" src="/js/modulos/distributivo.js"></script></body></html>
