<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Ecosistema Educativo</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/componentes.css">
<link rel="stylesheet" href="/css/modulos/ingreso.css"></head>
<body><div id="plantilla"></div><main id="contenido" class="contenedor">
  <div class="tarjeta auth-tarjeta">
    <header class="auth-tarjeta__cabecera">
      <h1 class="auth-tarjeta__titulo">Iniciar sesión</h1>
      <p class="auth-tarjeta__subtitulo">Ingresa tus credenciales para acceder al ecosistema educativo.</p>
    </header>

    <form id="formIngreso" novalidate class="pila">
      <div class="campo" id="grupoCorreo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required placeholder="usuario@correo.com">
        <span class="campo__error" id="errorCorreo" aria-live="polite"></span>
      </div>

      <div class="campo" id="grupoClave">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="current-password" required placeholder="••••••••">
        <span class="campo__error" id="errorClave" aria-live="polite"></span>
      </div>

      <div class="auth-tarjeta__acciones">
        <button type="submit" class="btn btn--primario btn--completo" id="btnIngreso">
          Ingresar
        </button>
      </div>
    </form>

    <footer class="auth-tarjeta__pie">
      <p>¿No tienes una cuenta? <a href="/paginas/registro.html">Regístrate aquí</a></p>
    </footer>
  </div>
</main>
<script type="module" src="/js/modulos/ingreso.js"></script></body></html>
